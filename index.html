<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>NeckBazz</title>

<style>

body{
background:black;
color:white;
font-family:Arial, sans-serif;
margin:0;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

/* texto superior */

.toptext{
position:absolute;
top:30px;
font-size:22px;
}

/* titulo */

h1{
font-size:70px;
margin-top:40px;
margin-bottom:40px;
animation:fadeColor 6s infinite alternate;
}

/* animacion */

@keyframes fadeColor{
0%{color:white;}
100%{color:#888;}
}

/* contenedor botones */

.botones{
display:flex;
flex-direction:column;
gap:25px;
}

/* botones */

.boton{
width:260px;
height:90px;
display:flex;
align-items:center;
justify-content:center;
border:2px solid white;
border-radius:14px;
}

.youtube{
background:white;
}

.tiktok{
background:black;
}

.icono{
height:45px;
}

</style>
</head>

<body>

<div class="toptext">gracias por apoyar el canal</div>

<h1>NeckBazz</h1>

<div class="botones">

<a class="boton youtube" href="https://www.youtube.com/@Neckbazz" target="_blank">
<img class="icono" src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg">
</a>

<a class="boton tiktok" href="https://www.tiktok.com/@neckbazzyts?_r=1&_t=ZS-94WwpRtQ9n5" target="_blank">
<img class="icono" src="tiktok.png">
</a>

</div>

</body>
</html>
